; Race Dash - Arduino Nano Firmware
; PlatformIO configuration for ATmega328P (Arduino Nano)
;
; UPLOAD:
;   USB: pio run -t upload  (auto-detects COM port)
;   Or specify port: pio run -t upload --upload-port COM3
;
; BUILD:
;   pio run              (compile only)
;   pio run -t upload    (compile + flash via USB)
;   pio device monitor   (serial monitor)
;
; WIRING NOTES:
;   D0 (RX) ← Speeduino Secondary Serial TX (5V TTL — use 10K/20K divider if needed)
;   D1 (TX) → Pi GPIO15 (RX) via 10KΩ/20KΩ voltage divider (5V → 3.3V)
;   D4      ← GPS TX (SoftwareSerial, 9600 baud)
;   A4 (SDA)→ MPU-6050 + MCP9600 x4 (I2C bus)
;   A5 (SCL)→ MPU-6050 + MCP9600 x4 (I2C bus)
;   D2      ← VSS pulse input (interrupt, INPUT_PULLUP)
;   A0      ← Clutch pot (0–5V analog)
;   D9      ← Status LED

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

; Upload via USB (CH340 or FTDI on most Nano clones)
upload_protocol = arduino

; Specify port if auto-detect fails:
; upload_port = COM3        ; Windows
; upload_port = /dev/ttyUSB0 ; Linux/Pi

; Old bootloader Nano clones — uncomment if upload fails with "sync" error:
; board_build.mcu = atmega328p
; board_upload.speed = 57600

; Libraries
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    arduino-libraries/SD

; Serial monitor (USB, 115200 baud)
monitor_speed = 115200
; monitor_port = COM3       ; Windows — uncomment and set if needed
; monitor_port = /dev/ttyUSB0 ; Linux

; Build flags
build_flags =
    -D LED_BUILTIN=9
    -Os                    ; Optimize for size (important on 32KB flash)
    -Wall
